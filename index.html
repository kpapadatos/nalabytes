<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nalabytes Ltd. - Feral Software</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Cal Sans', sans-serif;
        font-weight: 400;
        font-style: normal;
        line-height: 1.6;
        color: #333;
        background: linear-gradient(135deg, #191d30 0%, #000000 100%);
        min-height: 100vh;
      }

      header {
        text-align: center;
        margin-bottom: 3rem;
        color: white;
      }

      .logo {
        font-size: 3rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .tagline {
        font-size: 1.2rem;
        opacity: 0.9;
        margin-bottom: 2rem;
      }

      .video-container {
        position: relative;
        width: 100%;
        max-width: 400px;
        margin: 0 auto;
      }

      video {
        width: 100%;
        height: auto;
        mix-blend-mode: lighten;
        filter: contrast(1.5) hue-rotate(25deg) saturate(0.5);
      }

      .video-title {
        text-align: center;
        margin-bottom: 1.5rem;
        color: #333;
        font-size: 1.5rem;
      }

      .about {
        background: rgba(255, 255, 255, 0.1);
        padding: 2rem;
        backdrop-filter: blur(10px);
        color: white;
        text-align: center;
      }

      .about h2 {
        margin-bottom: 1rem;
        font-size: 2rem;
      }

      .about p {
        font-size: 1.1rem;
        opacity: 0.9;
        max-width: 600px;
        margin: 0 auto;
      }

      .contact {
        text-align: center;
        margin-top: 2rem;
        color: white;
        opacity: 0.8;
      }

      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }

        .logo {
          font-size: 2rem;
        }

        .video-section {
          padding: 1rem;
        }

        .about {
          padding: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="flex flex-col items-center justify-center h-screen">
      <section class="video-section">
        <div class="video-container">
          <video poster="" autoplay muted loop preload="metadata">
            <source src="nalabytes.mp4" type="video/mp4" />
            Your browser does not support the video tag.
          </video>
        </div>
      </section>
      <header>
        <div class="text-5xl">Nalabytes</div>
      </header>

      <footer class="contact mt-auto mb-3">
        <p>&copy; <span id="year"></span> Nalabytes. All rights reserved.</p>
        <script>
          document.getElementById('year').innerHTML = new Date().getFullYear();
        </script>
      </footer>
    </div>
  </body>
</html>
